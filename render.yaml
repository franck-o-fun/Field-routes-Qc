services:
  - type: web
    name: field-routes
    runtime: static
    buildCommand: echo "No build step"
    staticPublishPath: .
    headers:
      # Phones must always check for a new version of these, or updates never arrive.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
